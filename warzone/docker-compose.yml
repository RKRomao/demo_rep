version: '3.8'

services:
  # 1. Base de Dados MariaDB GIS 10.11 com Inicialização Automática do Esquema
  db:
    image: mariadb:10.11
    container_name: warzone-mariadb
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: warzone_db
    ports:
      - "3306:3306"
    volumes:
      - mariadb_data:/var/lib/mysql
      - ./schema_mariadb.sql:/docker-entrypoint-initdb.d/schema_mariadb.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "mariadb-admin ping -u root -proot || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 10

  # 2. Servidor Principal Web Node.js / Express (Frontend + API REST)
  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: warzone-web
    restart: always
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
      - DB_HOST=db
      - DB_PORT=3306
      - DB_USER=root
      - DB_PASSWORD=root
      - DB_NAME=warzone_db
    volumes:
      - .:/app
      - /app/node_modules
    depends_on:
      db:
        condition: service_healthy

  # 3. Backend Python FastAPI (Serviços GIS & Análise Geodésica)
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: warzone-backend
    restart: always
    ports:
      - "8000:8000"
    environment:
      - PORT=8000
      - DB_HOST=db
      - DB_PORT=3306
      - DB_USER=root
      - DB_PASSWORD=root
      - DB_NAME=warzone_db
    depends_on:
      db:
        condition: service_healthy

  # 4. Robô de Scraping Python (Ingestão NASA FIRMS em Tempo Real + OSINT)
  scraper:
    build:
      context: .
      dockerfile: Dockerfile.scraper
    container_name: warzone-scraper
    restart: always
    environment:
      - DB_HOST=db
      - DB_PORT=3306
      - DB_USER=root
      - DB_PASSWORD=root
      - DB_NAME=warzone_db
      - SCRAPER_INTERVAL_SECONDS=300
      - NASA_FIRMS_MAP_KEY=620b7bc1a6beaa2ffcbb5ed77cf968e7
    volumes:
      - ./scraper:/app
    depends_on:
      db:
        condition: service_healthy

volumes:
  mariadb_data:
